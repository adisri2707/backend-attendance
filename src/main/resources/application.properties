# Application
spring.application.name=attendance-management-system
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_management_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Firebase
firebase.enabled=false
firebase.credentials-path=

# Security
app.security.enabled=false

